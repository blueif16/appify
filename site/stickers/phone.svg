<svg xmlns="http://www.w3.org/2000/svg" width="104" height="204" viewBox="0 0 104 204">
  <!-- A phone on its Home Screen, with appify's own icon installed. -->
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a9a9b0"/>
      <stop offset=".08" stop-color="#ececf0"/>
      <stop offset=".5" stop-color="#d4d4da"/>
      <stop offset=".92" stop-color="#f2f2f5"/>
      <stop offset="1" stop-color="#9e9ea6"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#ffc6e6"/>
      <stop offset=".35" stop-color="#c3b2ff"/>
      <stop offset=".7" stop-color="#9edcff"/>
      <stop offset="1" stop-color="#b9f2d6"/>
    </linearGradient>
    <radialGradient id="glow" cx=".7" cy=".3" r=".7">
      <stop offset="0" stop-color="#fff" stop-opacity=".6"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="photo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd2a1"/>
      <stop offset=".45" stop-color="#ff9a8b"/>
      <stop offset="1" stop-color="#4b3f7a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".34"/>
      <stop offset=".42" stop-color="#fff" stop-opacity=".06"/>
      <stop offset=".421" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="screen"><rect x="9.5" y="8.5" width="85" height="187" rx="11.5"/></clipPath>
  </defs>

  <!-- side buttons -->
  <g fill="#b9b9c0" stroke="#1d1d1f" stroke-width="1.2">
    <rect x=".8" y="36" width="4" height="9" rx="1.5"/>
    <rect x=".8" y="52" width="4" height="17" rx="1.5"/>
    <rect x=".8" y="73" width="4" height="17" rx="1.5"/>
    <rect x="99.2" y="58" width="4" height="27" rx="1.5"/>
  </g>

  <!-- frame, bezel, screen -->
  <rect x="3" y="2" width="98" height="200" rx="17" fill="url(#frame)" stroke="#1d1d1f" stroke-width="1.8"/>
  <rect x="6" y="5" width="92" height="194" rx="14.5" fill="#0b0c0c"/>
  <g clip-path="url(#screen)">
    <rect x="9.5" y="8.5" width="85" height="187" fill="url(#wall)"/>
    <rect x="9.5" y="8.5" width="85" height="187" fill="url(#glow)"/>

    <!-- status bar -->
    <text x="21" y="20.6" font-family="-apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="7" font-weight="600" fill="#1d1d1f">9:41</text>
    <g fill="#1d1d1f">
      <rect x="69" y="17.4" width="1.6" height="2.6" rx=".4"/><rect x="71.4" y="16.4" width="1.6" height="3.6" rx=".4"/><rect x="73.8" y="15.4" width="1.6" height="4.6" rx=".4"/>
      <rect x="78.4" y="15.4" width="8.6" height="4.6" rx="1.4" fill="none" stroke="#1d1d1f" stroke-width=".8"/>
      <rect x="79.4" y="16.4" width="5.6" height="2.6" rx=".7"/>
      <rect x="87.6" y="16.9" width=".8" height="1.6" rx=".3"/>
    </g>

    <!-- photo widget -->
    <rect x="17" y="29" width="70" height="34" rx="8" fill="url(#photo)"/>
    <circle cx="70" cy="40" r="5" fill="#fff3c4" fill-opacity=".9"/>
    <path d="M17 52c12-5 22-5 34 0s22 5 36 0v3c0 4-4 8-8 8H25c-4 0-8-4-8-8Z" fill="#2c2550" fill-opacity=".55"/>
    <rect x="21.5" y="54.5" width="18" height="2.4" rx="1.2" fill="#fff"/>
    <rect x="21.5" y="58.4" width="11" height="1.8" rx=".9" fill="#fff" fill-opacity=".7"/>

    <!-- icons: row 1 -->
    <rect x="17" y="70" width="14" height="14" rx="4" fill="#000"/>
    <rect x="21.5" y="79" width="5" height="1.4" fill="#fff"/>
    <rect x="35.7" y="70" width="14" height="14" rx="4" fill="#fff"/>
    <circle cx="42.7" cy="77" r="3.6" fill="none" stroke="#1d1d1f" stroke-width="1.4"/><circle cx="42.7" cy="77" r="1.3" fill="#1d1d1f"/>
    <rect x="54.3" y="70" width="14" height="14" rx="4" fill="#d1d1d6"/>
    <rect x="57.3" y="73.5" width="8" height="1.4" rx=".7" fill="#1d1d1f"/><rect x="57.3" y="76.5" width="8" height="1.4" rx=".7" fill="#6e6e73"/><rect x="57.3" y="79.5" width="5" height="1.4" rx=".7" fill="#6e6e73"/>
    <rect x="73" y="70" width="14" height="14" rx="4" fill="#1d1d1f"/>
    <path d="M76.5 74.5h7a1.5 1.5 0 0 1 1.5 1.5v3a1.5 1.5 0 0 1-1.5 1.5h-4l-2.5 2v-2h-.5A1.5 1.5 0 0 1 75 79v-3a1.5 1.5 0 0 1 1.5-1.5Z" fill="#fff"/>

    <!-- row 2 -->
    <rect x="17" y="92" width="14" height="14" rx="4" fill="#fff"/>
    <path d="M24 95.5a3.3 3.3 0 0 1 3.3 3.3c0 2.5-3.3 5.2-3.3 5.2s-3.3-2.7-3.3-5.2a3.3 3.3 0 0 1 3.3-3.3Z" fill="#1d1d1f"/><circle cx="24" cy="98.8" r="1.1" fill="#fff"/>
    <rect x="35.7" y="92" width="14" height="14" rx="4" fill="#1d1d1f"/>
    <path d="M44.6 95.5v6.6M44.6 95.5l-3 .9" stroke="#fff" stroke-width="1.2" stroke-linecap="round" fill="none"/><circle cx="43.1" cy="102.3" r="1.6" fill="#fff"/>
    <rect x="54.3" y="92" width="14" height="14" rx="4" fill="#fff"/>
    <circle cx="61.3" cy="99" r="3.8" fill="none" stroke="#8e8e93" stroke-width="2.2" stroke-dasharray="1.6 1.4"/><circle cx="61.3" cy="99" r="1.6" fill="#8e8e93"/>
    <rect x="73" y="92" width="14" height="14" rx="4" fill="#ffffff" fill-opacity=".55" stroke="#fff" stroke-width=".8"/>
    <path d="M80 94.6c.5 2.4 1.6 3.5 4 4-2.4.5-3.5 1.6-4 4-.5-2.4-1.6-3.5-4-4 2.4-.5 3.5-1.6 4-4Z" fill="#1d1d1f"/>

    <!-- row 3 -->
    <rect x="17" y="114" width="14" height="14" rx="4" fill="#d1d1d6"/>
    <circle cx="24" cy="121" r="4" fill="#fff"/><path d="M24 118.6v2.6l1.7 1" stroke="#1d1d1f" stroke-width="1" stroke-linecap="round" fill="none"/>
    <rect x="35.7" y="114" width="14" height="14" rx="4" fill="#fff"/>
    <path d="M38.5 125l3.4-4.4 2.4 2.8 1.6-1.8 2.4 3.4Z" fill="#1d1d1f"/><circle cx="46" cy="117.8" r="1.2" fill="#1d1d1f"/>
    <rect x="54.3" y="114" width="14" height="14" rx="4" fill="#000"/>
    <rect x="57.3" y="121.5" width="1.8" height="3.5" fill="#fff"/><rect x="60.4" y="119" width="1.8" height="6" fill="#fff"/><rect x="63.5" y="117" width="1.8" height="8" fill="#fff"/>
    <rect x="73" y="114" width="14" height="14" rx="4" fill="#fff"/>
    <path d="M80 117.5v7M76.5 121h7" stroke="#1d1d1f" stroke-width="1.4" stroke-linecap="round"/>

    <!-- labels under icons -->
    <g fill="#1d1d1f" fill-opacity=".45">
      <rect x="19" y="86" width="10" height="1.5" rx=".75"/><rect x="37.7" y="86" width="10" height="1.5" rx=".75"/><rect x="56.3" y="86" width="10" height="1.5" rx=".75"/><rect x="75" y="86" width="10" height="1.5" rx=".75"/>
      <rect x="19" y="108" width="10" height="1.5" rx=".75"/><rect x="37.7" y="108" width="10" height="1.5" rx=".75"/><rect x="56.3" y="108" width="10" height="1.5" rx=".75"/><rect x="75" y="108" width="10" height="1.5" rx=".75"/>
      <rect x="19" y="130" width="10" height="1.5" rx=".75"/><rect x="37.7" y="130" width="10" height="1.5" rx=".75"/><rect x="56.3" y="130" width="10" height="1.5" rx=".75"/><rect x="75" y="130" width="10" height="1.5" rx=".75"/>
    </g>

    <!-- page dots -->
    <circle cx="48" cy="160" r="1.3" fill="#1d1d1f"/><circle cx="52" cy="160" r="1.3" fill="#1d1d1f" fill-opacity=".3"/><circle cx="56" cy="160" r="1.3" fill="#1d1d1f" fill-opacity=".3"/>

    <!-- dock -->
    <rect x="14" y="167" width="76" height="21" rx="9" fill="#fff" fill-opacity=".45"/>
    <rect x="19.5" y="170.5" width="14" height="14" rx="4" fill="#fff"/>
    <path d="M23.3 174.4c.6-.6 1.6-.4 2 .4l.8 1.6c.3.6.1 1.3-.4 1.7l-.6.4c.5 1.2 1.4 2.1 2.6 2.6l.4-.6c.4-.5 1.1-.7 1.7-.4l1.6.8c.8.4 1 1.4.4 2-1.6 1.6-4.4.8-6.6-1.4s-3-5-1.4-6.6Z" fill="#1d1d1f"/>
    <rect x="37.5" y="170.5" width="14" height="14" rx="4" fill="#1d1d1f"/>
    <circle cx="44.5" cy="177.5" r="4.2" fill="none" stroke="#fff" stroke-width="1.2"/><path d="m46.6 175.4-1.4 2.8-2.8 1.4 1.4-2.8Z" fill="#fff"/>
    <rect x="55.5" y="170.5" width="14" height="14" rx="4" fill="#fff"/>
    <path d="M58.5 174.5h8v6h-8Z" fill="none" stroke="#1d1d1f" stroke-width="1.2" stroke-linejoin="round"/><path d="m58.5 174.8 4 3 4-3" fill="none" stroke="#1d1d1f" stroke-width="1.2" stroke-linejoin="round"/>
    <rect x="73.5" y="170.5" width="14" height="14" rx="4" fill="#d1d1d6"/>
    <circle cx="80.5" cy="177.5" r="3.4" fill="none" stroke="#1d1d1f" stroke-width="1.3"/><path d="m83 180 2 2" stroke="#1d1d1f" stroke-width="1.4" stroke-linecap="round"/>

    <!-- home indicator, island, glass -->
    <rect x="37" y="191.2" width="30" height="1.8" rx=".9" fill="#1d1d1f"/>
    <rect x="9.5" y="8.5" width="85" height="187" fill="url(#glass)"/>
  </g>
  <rect x="38" y="12.5" width="28" height="9" rx="4.5" fill="#000"/>
</svg>
