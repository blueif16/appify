<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>appify studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/studio.css">
  <script type="module" src="/studio.js"></script>
</head>
<body>
  <main class="bench">
    <div class="row"></div>
  </main>

  <!-- Background: registration marks around the stage. The stickers are drawn
       into .stickers by features/stickers.js. -->
  <div class="marks" aria-hidden="true">
    <i class="cross cross-tl"></i><i class="cross cross-tr"></i><i class="cross cross-bl"></i><i class="cross cross-br"></i>
  </div>

  <div class="stickers"></div>

  <a class="logo" href="https://appify-studio-zeta.vercel.app/" target="_blank" rel="noopener" aria-label="appify website (opens in a new tab)" title="appify website">
    <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect width="18" height="18" fill="#000"/><rect x="5.5" y="13" width="7" height="1.6" fill="#fff"/></svg>
    <span>appify</span>
    <span class="logo-sub">studio</span>
  </a>

  <!-- Floating panels live in one container per edge; feature modules add
       theirs with studio.addPanel(). -->
  <div class="edge edge-left">
    <section class="panel dock" aria-label="Windows">
      <p class="caption">Windows</p>
      <div class="dock-items" role="group" aria-label="Open windows"></div>
      <div class="dock-add-wrap">
        <button type="button" class="dock-add" aria-haspopup="menu" aria-expanded="false">
          <svg width="18" height="14" viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M9 2v10M4 7h10"/></svg>
          Add device
        </button>
        <div class="add-menu panel" role="menu" hidden></div>
      </div>
    </section>
  </div>

  <div class="edge edge-right">
    <section class="panel" aria-label="Open as">
      <p class="caption">Open as</p>
      <div class="seg" role="group" aria-label="How the app is opened" data-key="mode">
        <button type="button" data-value="browser">
          <svg width="18" height="14" viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><rect x="2.65" y=".65" width="12.7" height="12.7"/><path d="M2.65 4.35h12.7"/></svg>
          Browser tab
        </button>
        <button type="button" data-value="installed">
          <svg width="18" height="14" viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><rect x="3.15" y=".65" width="5" height="5"/><rect x="9.85" y=".65" width="5" height="5"/><rect x="3.15" y="8.35" width="5" height="5"/><rect x="9.85" y="8.35" width="5" height="5"/></svg>
          Home Screen app
        </button>
      </div>
    </section>
    <section class="panel" aria-label="Size">
      <p class="caption">Size <span class="scale-readout"></span></p>
      <div class="seg" role="group" aria-label="Size" data-key="zoom">
        <button type="button" data-value="fit">
          <svg width="18" height="14" viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M2.65 4.5V.65H6.5M11.5.65h3.85V4.5M15.35 9.5v3.85H11.5M6.5 13.35H2.65V9.5"/></svg>
          Fit
        </button>
        <button type="button" data-value="actual">
          <svg width="18" height="14" viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><rect x="2.65" y=".65" width="12.7" height="12.7"/><rect x="6.65" y="4.65" width="4.7" height="4.7"/></svg>
          100%
        </button>
      </div>
    </section>
  </div>

  <div class="edge edge-bottom">
  <form class="panel route" autocomplete="off">
    <button type="button" class="origin" title="Change which app the studio opens">Choose app</button>
    <input class="path" name="path" value="/" spellcheck="false" aria-label="Page to open">
    <button type="button" class="icon reload" title="Reload every view" aria-label="Reload every view">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" aria-hidden="true"><path d="M13.5 8A5.5 5.5 0 1 1 11.6 3.8M13 1.5v3.2H9.8"/></svg>
    </button>
  </form>
  </div>

  <dialog class="target-dialog">
    <form>
      <p class="caption">Open an app</p>
      <h2>Which app should the studio open?</h2>
      <p class="dialog-copy">Paste the address of your running dev server, or any site you want to see on phones.</p>
      <input name="url" placeholder="http://localhost:3000" aria-label="App address" required autofocus>
      <p class="error" role="alert"></p>
      <div class="dialog-actions">
        <button type="button" class="btn quiet cancel">Cancel</button>
        <button class="btn primary">Open app</button>
      </div>
    </form>
  </dialog>
</body>
</html>
