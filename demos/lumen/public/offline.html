<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Lumen · Offline</title>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <style>
    html, body { height: 100%; margin: 0; background: #f4f5f7; }
    body {
      display: grid; place-items: center; padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
      font: 16px/1.5 -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; color: #1d2327; text-align: center;
    }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { margin: 16px 0 4px; font-size: 22px; }
    p { margin: 0 0 24px; color: #6b7378; }
    button { min-height: 50px; padding: 0 28px; border: 0; border-radius: 12px; background: #5b3df5; color: #fff; font: inherit; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>Lumen will be back as soon as you have a connection.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
